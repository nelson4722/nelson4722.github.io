<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Sorteo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="modal">
    <div id="modalContent">
      <h2>Ingresa tu nombre</h2>
      <input type="text" id="nombreInput" placeholder="Tu nombre">
      <button id="aceptarBtn" class="green">Jugar</button>
    </div>
  </div>

  <h2 id="saludo">Hola "Invitado", ganaste lo siguiente:</h2>

  <div id="premiosContainer">
    <div class="card">
      <div class="emoji" id="consumibleIcon">🍴</div>
      <div id="consumibleNombre">Consumible</div>
    </div>
    <div class="card">
      <div class="emoji" id="bebestibleIcon">🥤</div>
      <div id="bebestibleNombre">Bebestible</div>
    </div>
    <div class="card">
      <div class="emoji" id="articuloIcon">💊</div>
      <div id="articuloNombre">Artículo</div>
    </div>
  </div>

  <div>
    <button id="confirmarBtn" class="blue">Confirmar</button>
    <button id="reintentarBtn" class="red">Reintentar</button>
    <button id="homeBtn" class="green" style="display:none;">Home</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
